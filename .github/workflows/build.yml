name: Build PC (.exe) and Android (.apk)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Initialize platform configs if missing
        run: |
          mkdir -p temp_backup
          cp -r lib temp_backup/
          cp pubspec.yaml temp_backup/
          flutter create . --project-name markdown_studio --platforms=android,windows
          cp -r temp_backup/lib .
          cp temp_backup/pubspec.yaml .
          rm -rf temp_backup

      - name: Configure Android compileSdk 36
        run: |
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle android/app/build.gradle.kts 2>/dev/null || true
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          echo "subprojects { afterEvaluate { project -> if (project.hasProperty('android')) { project.android { compileSdkVersion 36 } } } }" >> android/build.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MarkdownStudio-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows Desktop EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Initialize platform configs if missing
        shell: bash
        run: |
          mkdir -p temp_backup
          cp -r lib temp_backup/
          cp pubspec.yaml temp_backup/
          flutter create . --project-name markdown_studio --platforms=android,windows
          cp -r temp_backup/lib .
          cp temp_backup/pubspec.yaml .
          rm -rf temp_backup

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Bundle into ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "MarkdownStudio-Windows-x64.zip"

      - name: Upload Windows Executable Package
        uses: actions/upload-artifact@v4
        with:
          name: MarkdownStudio-Windows-x64
          path: MarkdownStudio-Windows-x64.zip
